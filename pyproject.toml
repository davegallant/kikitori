[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-transcriber"
version = "0.1.0"
description = "Local Japanese podcast transcription library"
requires-python = ">=3.12"
dependencies = [
  "av>=15,<16",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.2,<2",
  "httpx>=0.28,<1",
  "httpcore>=1.0.9,<1.1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
  "transformers>=4.48,<5",
  "torch>=2.6,<3",
  "sentencepiece>=0.2,<1",
  "sacremoses>=0.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
podcast-transcriber = "podcast_transcriber.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
