<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kikitori{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/kikitori-cat.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" aria-label="Kikitori home"><img class="brand-mark" src="{{ url_for('static', path='/kikitori-cat.svg') }}" alt="" width="31" height="31"> Kikitori</a>
      </div>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
  </body>
</html>
