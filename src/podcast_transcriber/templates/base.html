<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Podcast Transcriber{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" aria-label="Podcast Transcriber home"><span class="brand-mark">▣</span> Podcast Transcriber</a>
        <span class="local-badge">LOCAL LIBRARY</span>
      </div>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
  </body>
</html>
